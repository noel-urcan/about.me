# Notion → Website: liest die Notion-Datenbank „Artikel“ und erzeugt index.html und articles.html.
# Läuft automatisch, kein Handgriff nötig. Ergebnis unter github.com/noel-urcan/about.me/actions.
name: Notion-Sync

on:
  push:
    branches: [main]
    paths:
      - "assets/**"            # neues Foto oder PDF hochgeladen → sofort synchronisieren
  schedule:
    - cron: "17 * * * *"       # jede Stunde um :17 UTC, in Deutschland also um :17 (Winter +1 h, Sommer +2 h ändern nur die Stunde, nicht die Minute)
  workflow_dispatch:           # manueller Start über den Knopf „Run workflow“

permissions:
  contents: write              # darf die erzeugten HTML-Dateien committen

concurrency:
  group: notion-sync           # nie zwei Läufe gleichzeitig
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    # Schutz gegen Endlosschleife: Commits des Bots lösen keinen weiteren Lauf aus
    if: github.actor != 'github-actions[bot]'
    steps:
      - name: Repo auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Abhängigkeiten installieren
        run: pip install -r requirements.txt

      - name: Notion lesen, prüfen, Seiten erzeugen
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
        run: python3 scripts/sync_notion.py

      - name: Änderungen committen und pushen (nur wenn es welche gibt)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html articles.html assets/img/*.webp
          if git diff --cached --quiet; then
            echo "Keine Änderung an der Website."
          else
            git commit -m "Sync aus Notion ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            git push
          fi
